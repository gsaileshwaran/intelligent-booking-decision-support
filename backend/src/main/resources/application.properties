# Spring Boot Application Properties - Intelligent Booking System
spring.application.name=intelligent-booking-backend
server.port=8080

# Database Configuration (H2 In-Memory MySQL Compatibility Mode)
spring.datasource.url=jdbc:h2:mem:intelligent_booking_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

