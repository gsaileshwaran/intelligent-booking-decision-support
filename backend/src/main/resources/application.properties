# Spring Boot Application Properties - Intelligent Booking System
spring.application.name=intelligent-booking-backend
server.port=${SERVER_PORT:8080}

# Database Configuration - MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/intelligent_booking_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Security JWT Settings (64 ASCII Characters = 512 bits for HMAC-SHA Security Compliance)
app.jwt.secret=${APP_JWT_SECRET:v9y$B?E(H+MbQeThWmZq4t7w!z%C*F-J@NcRfUjXn2r5u8x/A?D(G+KbPeSgVkYp}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Booking Hold Settings (10 Minutes Expiration)
app.booking.hold-duration-ms=${APP_BOOKING_HOLD_DURATION_MS:600000}
