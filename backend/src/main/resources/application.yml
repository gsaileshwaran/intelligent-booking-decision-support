server:
  port: ${PORT:8080}

spring:
  application:
    name: pvk-cinemas-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:pvk_cinemas_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  business-date: ${BUSINESS_DATE:2026-09-18}
  demo-window-days: ${DEMO_WINDOW_DAYS:7}
  jwt:
    secret: ${JWT_SECRET:pvk-cinemas-super-secure-hmac-sha256-secret-key-for-jwt-tokens-2026!}
    expiration-minutes: 30
  search:
    service-url: ${SEARCH_SERVICE_URL:http://127.0.0.1:8001}
    fallback-enabled: ${SEARCH_FALLBACK_ENABLED:true}

